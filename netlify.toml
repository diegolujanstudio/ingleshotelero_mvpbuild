[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  CACHE_BUST = "2026-05-14-rebuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The app's one address is app.ingleshotelero.com. Netlify does not
# auto-redirect the *.netlify.app origin for this runtime, so old links
# (WhatsApp messages already sent, bookmarks, the pre-domain QR era) are
# forwarded explicitly. 301 so the new domain accrues any link equity.
[[redirects]]
  from = "https://ingleshotelero.netlify.app/*"
  to = "https://app.ingleshotelero.com/:splat"
  status = 301
  force = true
